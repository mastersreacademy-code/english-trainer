name: Real Worker browser integration (local only)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  worker-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund && npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests against local Wrangler Worker and SQLite Durable Object
        run: npx playwright test --config playwright.runtime.config.js
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-traces
          path: test-results/
          retention-days: 7
